[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emergent-gr-anisotropic-source-dm-de-repro"
version = "0.1.0"
description = "Reproducibility package for the anisotropic-source tensor and the dark-matter / dark-energy mixture decomposition on the relational lattice."
authors = [
    { name = "Sandro Bucciarelli", email = "sandro.bucciarelli89@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["emergent gravity", "dark matter", "dark energy", "cosmological constant", "energy conditions", "reproducibility"]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.urls]
Repository = "https://github.com/[anonymized]/emergent-gr-anisotropic-source-dm-de-repro"
Homepage = "https://github.com/[anonymized]/emergent-gr-anisotropic-source-dm-de-repro"
Issues = "https://github.com/[anonymized]/emergent-gr-anisotropic-source-dm-de-repro/issues"
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"